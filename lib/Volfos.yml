Culture :
  Description : >-
    The Volfan kingdoms have a reputation for isolationism, largely owing to their
    location in the inhospitable north of Osall. Not much is known of their internal
    culture, though Volfan expatriates as a whole tend to gravitate towards mercenary
    companies and often act as elite bodyguards for government officials across
    multiple nations.
