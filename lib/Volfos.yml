  Description : >-
    Volfos is the name given to a loose confederation of petty kingdoms in the frigid tundras of
    Northern Osall. Though technically independent, the kingdoms typically delegate foreign policy
    matters on a decennial basis, nominating one of the constituent Konungs (petty kings) to represent
    the confederation for a term of 10 years.
