  The Rulers of Aroth: |-
    ??? warning "Spoiler"
        "Let me tell you an old tale. One of a people who relied on The Sight to guide them." As he spoke, little
        figures formed in the smoke like cave paintings. One with an obvious crown stood in front, gesturing at the
        following crowd. "The more powerful The Sight, the greater the position given." More crowned figures appeared,
        forming a pyramidal tower. Each level higher held significantly fewer members and bore more complex crowns.
        At the tip, a single figure bore the tallest headpiece of them all.

        "Naturally, this led many to seek greater and greater power. Visions beyond what natural science can tell us.
        Not simple parlor tricks, like cards from a deck, or leaves in a cup of tea. Sight of things that have never
        been. And never should be. Ways to ensure the outcomes that you want."

        One figure in particular stood before a hole, a yawning pit where the smoke had vacated. "There is, of course, 
        a price to pay." The figure was sucked into the gap, disappearing entirely. Another figure took its place, 
        and the cycle repeated. Figure after figure walked to the edge of the gap, dissolved, and was replaced by
        the next.

        "The cost of defying The Fates is not one you can put off forever. Eventually, the debt becomes due." 
        The scene on the ground changed shape, reassembling into a pillar with ornate base and capital. 
        "Those unwilling to pay the price themselves, simply pass it on to the rest." The smoky pillar began to 
        crack from the top, fissures spreading until it collapsed in upon itself, leaving nothing but a roiling 
        bubbling layer of fog where it once stood.

        "Everything that was gained through otherworldly knowledge, will surely be taken away." The smoke formed
        into the contours of the continent, a map of the entirety of Lanoroth. Then chunks began to fall away, 
        piece by piece, collapsing to the present-day borders of Aroth. "There are, of course, those who never learn. 
        And those who think that through cleverness, or ingenuity, or sheer personal force, they can harness this
        terrible knowledge. And rise once again to the top." The borders began to grow outwards again. "There is much
        that can be done to either speed the process along…" Soon, the borders encompassed the current Commonwealth 
        of Iska and neighboring principalities. "…or stop it form happening altogether." And the borders collapsed 
        back to current Aroth.

        "The trick," he finished, "is knowing which one is going to cost more. And unfortunately, the only way to 
        know is to risk it all and make the bargain in the first place."
