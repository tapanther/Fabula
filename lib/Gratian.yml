Occupation :
  Role : Arothian State Augur
  Note : Awaiting official assignment by the Curia of Aroth
  Location : Kamynthos
Description : |-
  Surprisingly young for the silver diadem, his fur bears the old scars of a presumably violent youth.
  He is robed in a multitude of colors, evoking the dazzling aurora that is central to the Northern
  religion. Every fold and pocket holds a token of his profession, and his paws bear the distinctive
  stylized eye Bearer Marks of an Augur.
  
  While it is rare to see an Augur outside of their Curia-assigned jurisdiction, there are numerous
  corroborated encounters with Gratian well beyond the borders of Aroth. It is not clear whether these
  excursions are officially sanctioned State missions, a carefully diverted eye from the Comitium Praetoriata,
  or something else altogether.
  
  Travelers describe him favorably, remarking upon an unexpectedly friendly and good-natured disposition,
  though entirely lacking in decorum or taste. Many recall the young Augur's purse more than his presence,
  as he is reportedly a generous, if secretive, patron. Even the prevailing rumors circulating after his passage
  point to visits paid to families of those lost in his service, and an unofficial pension drawn from the
  Augur's own good faith and credit.
NotableEvents :
  The Aeldra : |-
    ??? warning "Spoiler"
        Gratian traveled to Kamynthos, guarded by only a miniscule 4-person detachment, to track down and
        acquire the Aeldra's feathers, the local mythical beast and quasi-natural spirit of the town.
  Prophesy to Minos : |-
    !!! quote 
        Child of calamity, Ruinbringer. Cut off from the life you were promised, forced to wander the
        wretches of the Outlands. You who seeks the sweet taste of acclaim and adoration will instead
        be forced to swallow the bitter brew of infamy before your name is forever stricken from the record.
        
        And yet, your fate is of your own choosing. You may embrace the foretold ruin that has been
        your undoing, fulfill the ill omen that hangs over your horns like the executioner's blade; or
        you may choose to rage against the stars that cursed your birth, shake off the yoke of prophesy
        around your shoulders, and forge your own destiny.
  Prophesy to Renata : |-
    !!! quote
        I see a path that leads to Velia, where your family resides, a road less taken beyond the Trials.
        Few who wander the Outlands earn the privilege of Absolution, fewer still are prepared to pay
        the price.
    
        Seek the guidace of the Augurs that roam the countryside, they may guide you past the Tribunal's
        eyes.
  To Antirrh : |-
    !!! quote
        What you seek is history, not prophesy. In the far north, well past Velia, in the frozen wastes,
        legend tells of a village named Nysanthus, burnt to ash when the spirit of the Moon and Stars
        fell from the heavens and scorched everything in it's path. There, within the grave of the
        heavens, you may find that which you seek.
  To Oriel : |-
    !!! quote
        Wheel of Fortune, your inevitable fate. The Hanged Man, your sacrifice. Justice, your awakening.
    
        It's certainly auspicious that fortune saw fit to send me here. It seems you are on the cusp of a great and
        terrible journey. You seek to uncover knowledge best left undisturbed and will have to pay a terrible price
        for it." He offered an apologetic grimace. "I'm sorry that it's not a more favorable outcome. However, take
        solace that, contrary to what The State would like to think, not everything is set in stone.
  To A.C.E. : |-
    !!! quote
        The Empress. Death. The Emperor.

        How curious. It seems you are on the precipice between two diametrically opposed forces. Nature vs Order.
        Chaos vs Control. Rigidity vs Flexibility. You, who have seen the cycle of things may have the opportunity
        to break it.