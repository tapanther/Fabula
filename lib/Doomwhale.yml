title : Doomwhale
altLinks :
  - Exitiicetus
GeneralInfo :
  Description: |-
    The largest predator ever discovered, the Doomwhale shares little with the more placid common whales beyond their
    immense size and voracious appetite. Reported sightings place these creatures spanning an enormous 35 to 50 meters,
    though these claims are unsubstantiated.
    
    Though encounters with a Doomwhale are extremely rare, as these predators seldom bother with prey as small
    as people, they have been known to swallow ships whole, leaving only a handful of fortunate survivors that managed
    to jump ship before it disappeared into the titan's maw.
