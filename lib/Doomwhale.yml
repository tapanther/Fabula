    Title: Arothian Connection
    Text: |-
      The Basileia of Aroth adopted the Doomwhale as its sacred standard and supreme military emblem, representing
      the unconquerable might of the Arothian State. Each legion is granted a silver Doomwhale standard upon its 
      founding, the loss of which is grounds for dissolution. The standard-bearers, or "cetelifer", is considered
      a position of enormous prestige and generally awarded to those who can be trusted to keep it safe above their
      own lives.

      The association between Aroth and the Doomwhale is noted by multiple individuals, in and out of Aroth, though
      the latter tend to refer more to the threat posed by the Basileia's insatiable appetite for conquest and its
      tendency to swallow nations whole.
