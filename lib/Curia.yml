  Traditions :
    Confirmatio Augurum : >-
      The Confirmation of the Augur, a ceremony held to bestow a unique, ornamental diadem upon the crown of those
      who've demonstrated a blessing of wisdom and prophesy, and proven themselves worthy of joining the ranks of
      the Curia. As the Augurship is held for life, ascensions are rare generational occurrences.
    Clamor Bellicus : >-
      The formal declaration of war and call to arms, whereby the military members of the Curia are ceremonially
      handed a symbolic mace to represent their unquestionable authority and mandate to scour the Basileia's enemies.
      Though the weapons are largely decorative today, and the enemies more conceptual than existential threats, the
      tradition is believed to have arisen from an apocryphal event where the Curiales smashed seats and tables apart
      to use as makeshift weapons against an attempted sacking of the city.
