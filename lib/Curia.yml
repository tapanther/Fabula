  Locations :
    Curia Olethriocetus : >-
      The colloquial name from time immemorial of the soaring cathedral that hosts the assembly itself. The
      name is an allusion to the Doomwhale that serves as the Empire's ubiquitous insignia, and perhaps an oblique
      reference to the Curia's insatiable hunger for power.
