Culture :
  Description : |-
    The highest constituting asssembly of the Basileia, composed of a mix of State Augurs that act as
    regional governors, their military counterparts, and a smattering of other prestigious positions
    within the Empire.

    The Curia is rarely assembled in whole, delegating the majority of mundane decision-making and administration
    to a number of specially formed committees (Comitia). The Basileus may summon the 347-member body at will, most
    commonly during times of national crisis or major reform.
