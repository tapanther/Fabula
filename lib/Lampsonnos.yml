  Description : |-
    A regional capital within The Commonwealth's myriad of administrative districts. The city is centrally located
    within the Ciminian Forest, and previously served as an Arothian provincial capital. Though the city does not
    itself lay on the Exocos Odo, the primary Aroth-Iska trade route, it nevertheless controls the flow of goods
    through the few well-maintained highways through the dense woods.
