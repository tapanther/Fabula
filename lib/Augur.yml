    Type : Ordained Priesthood, Regional Governors
    Membership : 153
    Allegiance : Basileia of Aroth
  Description : >-
    State Augur is the highest civil and spiritual title within the Basileia of Aroth, second only in prestige
    to the Basileus themselves. Note that while other ranks of augur as a prophetic and spiritual leader exist within 
    the Basileia, and indeed elsewhere in the known world, it is the Diademed Intendants that are typically referred 
    to as Augurs (capitalized).
