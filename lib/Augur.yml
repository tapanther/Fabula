Culture :
  Description : >-
    The Arothian State Augurs form the highest echelon of the civil government, serving as regional governors for the
    Basileia's provinces, as well as overseeing the lesser Novice and Adept augurs and seers that serve in primarily
    spiritual positions as ministers within the traditions of the Ephorian Mysteries.
