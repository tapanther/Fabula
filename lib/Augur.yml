#      TEXT
  Traditions :
    Confirmatio Augurum: >-
      The Confirmation of the Augur, a ceremony held to bestow a unique, ornamental diadem upon the crown of those
      who've demonstrated a blessing of wisdom and prophesy, and proven themselves worthy of joining the ranks of
      the Curia. As the Augurship is held for life, ascensions are rare generational occurrences.
