Structure :
  Governance : >-
    The Curia Omnipotentia has sole supervisory authority over its member State Augurs. By tradition, the non-ordained
    Curia members abstain from deliberations regarding a constituent member, in deference to the Augurs' temporal and
    spiritual roles within the Basileia.
  Locations :
    City of Aroth : |-
      The Augurs constitute a little under half of the Curia Omnipotentia's membership (the nation's sovereign
      assembly), with about an equal measure of regional military leaders (Praesides, Magisters, and Legates).
    Vindonnissa : |-
      A border city along the main trade route between the Basileia and Iska, and the regional Augural seat.
  Members :
    Aurica Cinca : >-
      State Augur of Vindonnissa
    Gratian Constantinus : >-
      State Augur, unknown Augural Seat.
